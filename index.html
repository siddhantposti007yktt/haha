<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fce4ec;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
            width: 450px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }

        #main-media {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        #main-media img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 15px;
        }

        .emoji { font-size: 100px; }

        h1 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 20px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            height: 100px;
            position: relative;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        #yesBtn {
            background-color: #e91e63;
            color: white;
            z-index: 10;
        }

        #noBtn {
            background-color: #fff;
            color: #e91e63;
            border: 3px solid #e91e63;
            position: fixed; /* Keeps it hovering over the screen */
            transition: 0.1s ease-out; /* Makes the jump feel snappy */
        }

        .hint {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
        }

        .heart {
            position: fixed;
            top: -10vh;
            font-size: 2rem;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="main-media">
            <div class="emoji">🐱</div>
        </div>
        
        <h1 id="question">podddaaaaaa, will you be my valentine?</h1>
        
        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" style="top: 55%; left: 55%;">No</button>
        </div>

        <p class="hint">"no" seems a bit shy 😈</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');
        const mediaContainer = document.getElementById('main-media');

        let yesScale = 1;

        // Teleport logic
        noBtn.addEventListener('mouseover', () => {
            // Get screen dimensions minus button size to keep it in view
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;
            
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;

            // Grow the Yes button
            yesScale += 0.2;
            yesBtn.style.transform = `scale(${yesScale})`;
        });

        function celebrate() {
            question.innerHTML = "I knew you'd make the right choice! 😉";
            // New "Good Decision" GIF
            mediaContainer.innerHTML = `<img src="https://media.giphy.com/media/d3mlE7uhX8KFgEmY/giphy.gif" alt="Smart choice">`;
            
            noBtn.style.display = 'none'; // Only vanishes after Yes is clicked
            yesBtn.style.transform = "scale(1)";
            yesBtn.innerHTML = "Perfect! ❤️";
            
            for (let i = 0; i < 50; i++) {
                setTimeout(createHeart, i * 50);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
    </script>
</body>
</html>
